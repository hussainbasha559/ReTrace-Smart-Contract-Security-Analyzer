[alembic]
script_location = alembic
prepend_sys_path = .
# The URL comes from the DATABASE_URL environment variable (see alembic/env.py); never put credentials here.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
